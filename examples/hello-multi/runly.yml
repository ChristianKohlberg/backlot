# yaml-language-server: $schema=../../schema/runly.schema.json
#
# The multi-service variant fixture: everything hello-web deliberately doesn't
# exercise — two HTTP services wired by {{services.*.url}}, depends_on ordering,
# a PORTLESS worker with log-marker readiness, fatal_logs fail-fast, three
# presets with a non-default creation preset, and an upkeep rule with the
# engine built-in that rebakes the data template when the seed changes.
name: hello-multi

services:
  api:
    run: node api.mjs
    port: api
    env:
      PORT: "{{ports.api}}"
      DB_PATH: "{{datastores.main.url}}"
    ready: { http: /health, timeout: 30 }
    fatal_logs: "Error:"
  web:
    run: node web.mjs
    port: web
    depends_on: [api]
    env:
      PORT: "{{ports.web}}"
      API_URL: "{{services.api.url}}"
    ready: { http: /health, timeout: 30 }
    fatal_logs: "Error:"
  worker:
    run: node worker.mjs
    env:
      DB_PATH: "{{datastores.main.url}}"
    ready: { log: "worker ready", timeout: 30 }

datastores:
  main:
    driver: sqlite
    create: node seed.mjs {{ns}} {{preset}}
    presets: [dev, demo, empty]
    default_preset: { session: demo }   # new datastores are created with demo
    template: true

upkeep:
  - { when: seed.mjs, run: "@rebake-template main" }

# The smoke test is the repo's own:
#   eval "$(runly ctx --env)" && node smoke.test.mjs
