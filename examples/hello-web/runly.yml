# yaml-language-server: $schema=../../schema/runly.schema.json
name: hello-web

services:
  web:
    # A syntax check as the build. It declares no `outputs:`, so every
    # `runly up` restarts web and an edit to server.mjs is served.
    build: node --check server.mjs
    run: node server.mjs
    port: web
    env:
      PORT: "{{ports.web}}"
      DB_PATH: "{{datastores.main.url}}"
    ready: { http: /health, timeout: 30 }
    fatal_logs: "Error:"

datastores:
  main:
    driver: sqlite
    create: node seed.mjs {{ns}} {{preset}}
    presets: [dev, empty]
    default_preset: { run: dev, session: dev }
    template: true # sqlite templating = file copy

# The smoke test is the repo's own: eval "$(runly ctx --env)" && node smoke.test.mjs
